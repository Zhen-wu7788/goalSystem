<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件提醒</title>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #fdfdfd;
            --accent: #ffcc00;
            --danger: #ff4d4d;
        }
        body { font-family: "Microsoft JhengHei", sans-serif; background: #e3d3f3; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 10px 10px 20px #bebebe, -10px -10px 20px #ffffff; }
        h1, h2 { margin: 0 0 20px; color: #333; }
        h1 { border-left: 6px solid var(--primary); padding-left: 12px; }
        input, textarea, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        button { background: var(--primary); color: #fff; border: none; cursor: pointer; transition: background 0.3s ease; }
        button:hover { background: #057678; }
        .reminder-item { background: #f9f9f9; padding: 18px; margin-bottom: 15px; border-radius: 15px; border: 1px solid #eee; }
        .reminder-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
        .reminder-title { font-size: 1.1em; font-weight: bold; color: #222; }
        .reminder-meta { color: #666; font-size: 0.95em; }
        .reminder-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
        .btn-edit { background: #ffb400; }
        .btn-delete { background: var(--danger); }
        .empty-state { color: #666; padding: 20px; background: #f5f5f5; border-radius: 12px; text-align: center; }
        .top-links { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 20px; }
        .top-links a { color: var(--primary); text-decoration: none; font-weight: bold; }
        @media (max-width: 600px) {
            .reminder-header { flex-direction: column; align-items: flex-start; }
            input, textarea, select, button { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-links">
        <h1>事件提醒</h1>
        <a href="index.html">返回小目標系統</a>
    </div>

    <div>
        <h2>新增 / 編輯提醒</h2>
        <input type="text" id="reminder-title" placeholder="提醒事項標題">
        <input type="date" id="reminder-date">
        <input type="time" id="reminder-time">
        <textarea id="reminder-note" placeholder="補充說明（選填）"></textarea>
        <button id="save-button" onclick="saveReminder()">新增提醒</button>
    </div>

    <section style="margin-top: 30px;">
        <h2>提醒列表</h2>
        <div id="reminder-list"></div>
    </section>
</div>

<script>
    const storageKey = 'eventReminders';
    let reminders = [];
    let editingId = null;

    function loadReminders() {
        const raw = localStorage.getItem(storageKey);
        reminders = raw ? JSON.parse(raw) : [];
        renderReminders();
    }

    function saveReminder() {
        const title = document.getElementById('reminder-title').value.trim();
        const date = document.getElementById('reminder-date').value;
        const time = document.getElementById('reminder-time').value;
        const note = document.getElementById('reminder-note').value.trim();

        if (!title) {
            return alert('請輸入提醒標題');
        }
        if (!date) {
            return alert('請選擇提醒日期');
        }

        const datetime = `${date}T${time || '00:00'}`;
        const reminder = {
            id: editingId || Date.now(),
            title,
            date,
            time: time || '',
            note,
            datetime
        };

        if (editingId) {
            reminders = reminders.map(item => item.id === editingId ? reminder : item);
            editingId = null;
            document.getElementById('save-button').innerText = '新增提醒';
        } else {
            reminders.push(reminder);
        }

        reminders.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
        localStorage.setItem(storageKey, JSON.stringify(reminders));
        resetForm();
        renderReminders();
    }

    function renderReminders() {
        const container = document.getElementById('reminder-list');
        if (reminders.length === 0) {
            container.innerHTML = '<div class="empty-state">目前尚未建立提醒，請新增一個事件。</div>';
            return;
        }

        container.innerHTML = reminders.map(reminder => {
            const displayTime = reminder.time ? reminder.time : '全天';
            const noteHtml = reminder.note ? `<p style="margin: 10px 0 0; color: #555;">${escapeHtml(reminder.note)}</p>` : '';
            return `
                <div class="reminder-item">
                    <div class="reminder-header">
                        <div>
                            <div class="reminder-title">${escapeHtml(reminder.title)}</div>
                            <div class="reminder-meta">${escapeHtml(reminder.date)} ${escapeHtml(displayTime)}</div>
                        </div>
                        <div class="reminder-actions">
                            <button class="btn-edit" onclick="editReminder(${reminder.id})">編輯</button>
                            <button class="btn-delete" onclick="deleteReminder(${reminder.id})">刪除</button>
                        </div>
                    </div>
                    ${noteHtml}
                </div>`;
        }).join('');
    }

    function editReminder(id) {
        const reminder = reminders.find(item => item.id === id);
        if (!reminder) return;
        editingId = id;
        document.getElementById('reminder-title').value = reminder.title;
        document.getElementById('reminder-date').value = reminder.date;
        document.getElementById('reminder-time').value = reminder.time;
        document.getElementById('reminder-note').value = reminder.note;
        document.getElementById('save-button').innerText = '更新提醒';
    }

    function deleteReminder(id) {
        if (!confirm('確定要刪除此提醒嗎？')) return;
        reminders = reminders.filter(item => item.id !== id);
        localStorage.setItem(storageKey, JSON.stringify(reminders));
        if (editingId === id) {
            editingId = null;
            resetForm();
        }
        renderReminders();
    }

    function resetForm() {
        document.getElementById('reminder-title').value = '';
        document.getElementById('reminder-date').value = '';
        document.getElementById('reminder-time').value = '';
        document.getElementById('reminder-note').value = '';
        document.getElementById('save-button').innerText = '新增提醒';
    }

    function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    loadReminders();
</script>
</body>
</html>
